name: Mise à jour de la veille technologique

on:
  schedule:
    - cron: "0 6 * * 1"  # tous les lundis à 6h00 UTC
  workflow_dispatch:       # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser pyyaml

      - name: Récupérer les flux RSS
        run: python scripts/fetch_veille.py

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/veille.yml
          git diff --staged --quiet || git commit -m "Mise à jour automatique de la veille technologique"
          git push
